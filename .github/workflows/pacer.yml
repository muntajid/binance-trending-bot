name: Square Pacer - Six Scheduled Opportunities per Day

# Reliable clock for the six-slot plan. Checks every few minutes but dispatches
# only after the shared minimum-gap and stable per-slot jitter gates release.
# A ~5.5-hour handoff renews the process; cron revives a lost chain. A duplicate
# pacer yields to the active leader. Logic/config: bot/pacer.py, bot/config.json.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  # workflow_dispatch via GITHUB_TOKEN is allowed to start new workflow runs.
  actions: write
  contents: read

jobs:
  pace:
    runs-on: ubuntu-latest
    # GitHub kills jobs at 360 minutes; the pacer hands off at 330.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pace the six-slot schedule with posting-time variation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m bot.pacer
