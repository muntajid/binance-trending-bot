name: Live Monitor - Every 10 Minutes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check TP/SL and Auto Post Success to Binance
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python -m bot.monitor_runner

      - name: Auto-commit closed trades
        run: |
          git config user.name "bot"
          git config user.email "bot@github.actions"
          git add data/ || true
          git commit -m "auto: monitor $(date -u)" || echo "Nothing to commit"
          git push || echo "Push done"
