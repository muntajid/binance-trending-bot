name: Live Monitor - Every 10 Minutes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-bot-state-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate master card assets
        run: python assets/generate_assets.py

      - name: Download official Binance Square posting scripts
        run: |
          rm -rf /tmp/binance-skills-hub
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git \
            /tmp/binance-skills-hub

      - name: Apply Square safety patches
        run: |
          python -m bot.patch_square_utf8
          python -m bot.patch_square_upload
          node --check /tmp/binance-skills-hub/skills/binance/square-post/scripts/lib.mjs

      - name: Check trades and publish target-hit cards
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          SQUARE_POLL_INTERVAL_MS: ${{ vars.SQUARE_POLL_INTERVAL_MS || '4000' }}
          SQUARE_POLL_MAX_RETRIES: ${{ vars.SQUARE_POLL_MAX_RETRIES || '15' }}
          SQUARE_PUBLISH_ATTEMPTS: ${{ vars.SQUARE_PUBLISH_ATTEMPTS || '3' }}
          SQUARE_PUBLISH_DEADLINE_SECONDS: ${{ vars.SQUARE_PUBLISH_DEADLINE_SECONDS || '240' }}
          TARGET_CARD_POSITION_SIZE_USDT: ${{ vars.TARGET_CARD_POSITION_SIZE_USDT || '5000' }}
          TARGET_CARD_LEVERAGE: ${{ vars.TARGET_CARD_LEVERAGE || '15' }}
          MONITOR_CANDLE_INTERVAL: ${{ vars.MONITOR_CANDLE_INTERVAL || '1m' }}
          MONITOR_MAX_LOOKBACK_HOURS: ${{ vars.MONITOR_MAX_LOOKBACK_HOURS || '168' }}
          MONITOR_MAX_KLINE_PAGES: ${{ vars.MONITOR_MAX_KLINE_PAGES || '20' }}
          CARD_TIMEZONE: ${{ vars.CARD_TIMEZONE || 'UTC' }}
          CARD_USERNAME: ${{ vars.CARD_USERNAME || 'muntajid' }}
          BINANCE_REFERRAL_CODE: ${{ vars.BINANCE_REFERRAL_CODE || '768056928' }}
          # Open setups nobody can resolve any more (delisted symbol, a scan
          # that keeps erroring) are archived as EXPIRED so they stop blocking
          # the coin. Empty value keeps the bot/config.json default.
          ACTIVE_TRADE_TTL_HOURS: ${{ vars.ACTIVE_TRADE_TTL_HOURS || '' }}
        run: python -m bot.monitor_runner

      - name: Commit updated trade state
        # Also runs when publishing failed: a closed or expired trade must be
        # persisted even if its card never reached Square, otherwise every later
        # run re-detects the same touch and the state files drift.
        if: always() && !cancelled()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "No trade-state changes to commit."
            exit 0
          fi

          git commit -m "auto: monitor $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Both workflows push to the same branch from independent runners, so
          # rebase and retry instead of losing state to a rejected push.
          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              pushed=1
              break
            fi
            echo "Push attempt ${attempt} rejected; rebasing onto the latest ${{ github.ref_name }}"
            git pull --rebase origin "${{ github.ref_name }}" || {
              git rebase --abort || true
              git pull --rebase origin "${{ github.ref_name }}"
            }
            sleep $((attempt * 3))
          done

          if [ "${pushed}" != "1" ]; then
            echo "::warning::State commit exists locally but could not be pushed; the next run will retry the push."
            exit 1
          fi
