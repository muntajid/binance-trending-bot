name: Price Consistency Test

on:
  workflow_dispatch:

jobs:
  consistency-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price consistency test
        run: python test_price_consistency.py
      
      - name: Run chart data consistency test
        run: python test_chart_data_consistency.py
