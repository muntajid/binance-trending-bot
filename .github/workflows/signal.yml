name: Signal Poster - Every 3 Hours (8x Day)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  post-signal:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Trending Signal and Charts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python bot/main_signal.py

      - name: Download official Binance Square posting scripts
        run: |
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git \
            /tmp/binance-skills-hub

      - name: Publish to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          set -e

          TEXT="$(cat data/latest_post.txt)"

          IMAGES="$(find charts -maxdepth 1 -type f -iname '*.png' -print | sort | head -4 | paste -sd, -)"

          if [ -n "$IMAGES" ]; then
            echo "Publishing image post to Binance Square..."
            node /tmp/binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs \
              --text "$TEXT" \
              --images "$IMAGES"
          else
            echo "No chart images found. Publishing text post..."
            node /tmp/binance-skills-hub/skills/binance/square-post/scripts/post-text.mjs \
              --text "$TEXT"
          fi

      - name: Auto-commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ charts/ || true

          git commit \
            -m "auto: signal ${{ github.run_id }} $(date -u)" \
            || echo "No changes to commit"

          git push || echo "Push skipped"
