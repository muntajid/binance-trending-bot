name: Signal Poster - Every 3 Hours (8x Day)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-bot-state-writer
  cancel-in-progress: false

jobs:
  post-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean old charts
        run: rm -f charts/*.png || true

      - name: Generate trending signal and charts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m bot.main_signal

      - name: Download official Binance Square posting scripts
        run: |
          rm -rf /tmp/binance-skills-hub
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git \
            /tmp/binance-skills-hub

      - name: Apply UTF-8 emoji safety patch
        run: |
          python -m bot.patch_square_utf8
          node --check /tmp/binance-skills-hub/skills/binance/square-post/scripts/lib.mjs

      - name: Publish signal to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          set -euo pipefail

          TEXT="$(cat data/latest_post.txt)"
          IMAGES="$(find charts -maxdepth 1 -type f -iname '*.png' -print | sort | head -4 | paste -sd, -)"

          if [ -n "$IMAGES" ]; then
            echo "Publishing image post to Binance Square..."
            node /tmp/binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs \
              --text "$TEXT" \
              --images "$IMAGES"
          else
            echo "No chart images found. Publishing text post..."
            node /tmp/binance-skills-hub/skills/binance/square-post/scripts/post-text.mjs \
              --text "$TEXT"
          fi

      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ charts/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "auto: signal ${{ github.run_id }} $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin main
          git push origin main
