name: Signal Poster - Every 2 Hours (12x Day)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-bot-state-writer
  cancel-in-progress: false

jobs:
  post-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean old charts
        run: rm -f charts/*.png || true

      - name: Generate trending signal and charts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: python -m bot.main_signal

      - name: Download official Binance Square posting scripts
        run: |
          rm -rf /tmp/binance-skills-hub
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git \
            /tmp/binance-skills-hub

      - name: Apply Square safety patches
        run: |
          python -m bot.patch_square_utf8
          python -m bot.patch_square_upload
          node --check /tmp/binance-skills-hub/skills/binance/square-post/scripts/lib.mjs

      - name: Publish signal to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          # Binance processes Square images asynchronously. The official helper
          # only waits ~30s, which is why uploads used to die with
          # "Poll timed out after 10 retries". Widen the window and let the
          # publisher retry the media stage before falling back to a text post.
          SQUARE_POLL_INTERVAL_MS: ${{ vars.SQUARE_POLL_INTERVAL_MS || '4000' }}
          SQUARE_POLL_MAX_RETRIES: ${{ vars.SQUARE_POLL_MAX_RETRIES || '20' }}
          SQUARE_PUBLISH_ATTEMPTS: ${{ vars.SQUARE_PUBLISH_ATTEMPTS || '3' }}
          SQUARE_PUBLISH_DEADLINE_SECONDS: ${{ vars.SQUARE_PUBLISH_DEADLINE_SECONDS || '420' }}
        run: |
          set -euo pipefail

          IMAGES="$(find charts -maxdepth 1 -type f -iname '*.png' -print | sort | head -4 | paste -sd, -)"

          python -m bot.square_publisher \
            --text-file data/latest_post.txt \
            --images "$IMAGES"

      - name: Commit generated state
        # Keep persisting signals/charts even when Square degrades, so a failed
        # publish cannot strand the generated slot state.
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ charts/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "auto: signal ${{ github.run_id }} $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin main
          git push origin main
